name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "design-preview.html"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install npm dependencies
        run: npm install

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Use debug keystore for release (CI installable APK)
        run: |
          # Make release build installable without a custom keystore
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          # Ensure release uses signingConfigs.debug
          if "signingConfig signingConfigs.debug" not in t or "buildTypes" in t:
              import re
              # Replace release block to sign with debug
              t2 = re.sub(
                  r"(release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.debug",
                  t,
                  count=1,
              )
              if t2 == t:
                  # fallback: inject after buildTypes {
                  t2 = t.replace(
                      "buildTypes {",
                      "buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n            minifyEnabled false\n        }\n        /*patched*/",
                      1,
                  )
              p.write_text(t2)
              print("Patched android/app/build.gradle for debug-signed release")
          else:
              print("Already configured")
          PY
          grep -n "signingConfig\|buildTypes\|release" android/app/build.gradle | head -40

      - name: Build RELEASE APK (embeds JS bundle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and stage APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/iftahli-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iftahli-apk
          path: iftahli-release.apk
          retention-days: 14
